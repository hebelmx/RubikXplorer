name: Release pilot

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_status:
        description: Play status (draft or completed); empty uses repository variable then draft
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-pilot
  cancel-in-progress: false

jobs:
  # Fails fast on a branch ref, a malformed tag or an unknown status, before the emulator job spends time.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      status: ${{ steps.inputs.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release inputs
        id: inputs
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          STATUS: ${{ inputs.release_status || vars.PLAY_RELEASE_STATUS || 'draft' }}
        run: bash .github/scripts/validate-release-inputs.sh "$REF_TYPE" "$TAG" "$STATUS" >> "$GITHUB_OUTPUT"

  instrumentation:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash .github/scripts/run-instrumentation.sh emulator-5554
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            docs/evidence/12-2/keyflow/ci/

  release:
    needs: [validate, instrumentation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: build-logic policy tests
        run: ./gradlew -p build-logic test
      - name: Decode upload keystore
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/cubentia-upload.p12"
      # Passed as -P flags: Gradle does not map ORG_GRADLE_PROJECT_ variables whose names contain dots.
      - name: Build signed release and size report
        env:
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ needs.validate.outputs.version }}
        run: |
          ./gradlew spotlessCheck build :app:bundleRelease :app:checkReleaseSize \
            "-Pcubentia.signing.storeFile=$RUNNER_TEMP/cubentia-upload.p12" \
            "-Pcubentia.signing.storePassword=$STORE_PASSWORD" \
            "-Pcubentia.signing.keyAlias=$KEY_ALIAS" \
            "-Pcubentia.signing.keyPassword=$KEY_PASSWORD" \
            "-Pcubentia.versionCode=$VERSION_CODE" \
            "-Pcubentia.versionName=$VERSION_NAME"
      - uses: actions/upload-artifact@v6
        with:
          name: pilot-release-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/cubentia/release-size.txt
      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.exxerpro.cubentia
          releaseFiles: app/build/outputs/bundle/release/*.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: ${{ needs.validate.outputs.status }}
      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/cubentia-upload.p12"
