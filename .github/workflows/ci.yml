name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel an in-flight push-to-main run; superseded PR runs may go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Guard: `build` must keep running every gate, never depend on detekt and never run a benchmark.
      - name: Verify build wires the gates
        run: |
          plan="$(./gradlew build --dry-run)"
          status=0
          for task in :app:checkModuleBoundaries :app:checkLearnerText \
                      :core:domain:checkModuleBoundaries :core:domain:koverVerify :core:domain:koverVerifyCube \
                      :core:domain:checkLearnerText \
                      :core:solver:checkModuleBoundaries :core:solver:koverVerify :core:solver:checkLearnerText \
                      :core:application:checkModuleBoundaries :core:application:koverVerify \
                      :core:application:checkLearnerText \
                      :app:checkDebugMergedManifest :app:checkReleaseMergedManifest \
                      :app:checkDebugSdkDenylist :app:checkReleaseSdkDenylist :app:checkPrivacyFacts :app:lintDebug \
                      :macrobenchmark:checkModuleBoundaries :macrobenchmark:assembleBenchmark \
                      :app:checkBenchmarkMergedManifest :app:checkBenchmarkSdkDenylist \
                      :core:solver:compileBenchmarkKotlin; do
            # Match the whole task path at line start, so one module's task cannot stand in for another's.
            if ! grep -qE -- "^${task} " <<<"$plan"; then
              echo "::error::./gradlew build no longer runs $task"
              status=1
            fi
          done
          if grep -qi -- ":detekt" <<<"$plan"; then
            echo "::error::./gradlew build depends on a detekt task"
            status=1
          fi
          # Benchmarks build in CI but run only on demand (Story 1.10): no device run, no harness run.
          if grep -qE -- "connected|solveCorpusBenchmark" <<<"$plan"; then
            echo "::error::./gradlew build runs a benchmark (connected* or solveCorpusBenchmark)"
            status=1
          fi
          exit $status

      # build = compile + Android lint + JVM tests + Kover >= 80% on :core:*
      # + AD-1 module boundaries + AD-13 merged-manifest and SDK-denylist checks.
      - name: Spotless and build
        run: ./gradlew spotlessCheck build

      - name: build-logic policy tests
        run: ./gradlew -p build-logic test

      - name: Release installed-size estimate
        run: ./gradlew :app:checkReleaseSize

      # AD-14: advisory until detekt has a stable release for Kotlin 2.4.
      - name: detekt (non-blocking)
        continue-on-error: true
        run: ./gradlew detekt

  spikes:
    name: Compile retained spikes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew -Pcubentia.spike3d=true :app:testDebugUnitTest --tests 'dev.cubentia.app.spike3d.*'
      - run: ./gradlew -Pcubentia.spikeScan=true :app:compileDebugKotlin
