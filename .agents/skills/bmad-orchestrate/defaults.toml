# Defaults for bmad-orchestrate (OpenCode).
# Override per project in {project-root}/_bmad/custom/bmad-orchestrate.toml.

[run]
max_stories = 3          # Stories to execute per run when no count is passed
handoff_every = 5        # Pause with a resume handoff after this many stories for context hygiene
worker = "subagent"      # "subagent" (Task tool -> subagent) or "headless" (`opencode run` per story)

[git]
default_branch = "main"
remote = "origin"
branch_prefix_default = "feat"
branch_prefix_rules = [
  { match = "^spike", prefix = "spike" },
  { match = "scaffold|ci|pipeline|release|build", prefix = "chore" },
  { match = "author|content", prefix = "content" },
]
merge_method = "merge"   # merge | squash | rebase  (gh pr merge --<method>)
delete_branch = true     # delete remote branch upon merge

[verify]
# Commands the orchestrator runs itself after the worker returns, independent of the
# worker's own verification. If empty, it uses the commands listed under the
# "Running and verifying" section of AGENTS.md; if that has none, the spec's
# `## Verification` section.
commands = []
log_tail_lines = 40      # only this many lines of a failing log are read into context

[gate]
# The adversarial acceptance gate (references/worker-prompts.md § Acceptance gate).
enabled = true
max_fix_rounds = 2
fail_on = ["high"]       # gate severities that block a merge

[review]
# A bmad-build-auto spec with followup_review_recommended = true gets this many extra review passes.
followup_passes = 1

[ci]
require_checks = true
timeout_minutes = 45
allow_merge_without_ci = false   # only honored when the repo has no workflow files at all

[epic]
retrospective = "auto"   # auto | ask | skip

# Human gates: stories that need a person (devices, secrets, consoles, decisions).
# when = "before-start" | "before-merge"
gates = []

# Post-merge actions: run after a given story merges, each on its own branch and PR.
# { key = "<story_key>", skill = "<skill-name>", args = "<args>", branch = "<branch>" }
post_merge = []
