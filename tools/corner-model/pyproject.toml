[project]
name = "cubentia-corner-model"
version = "0.1.0"
description = "Reproducible synthetic 3D + real-palette 7-keypoint corner detection training and LiteRT export pipeline for Cubentia Quick Scan (Story 10.18)."
requires-python = ">=3.11,<3.13"
