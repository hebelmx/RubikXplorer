[versions]
kotlin = "2.4.21"
agp = "9.5.0"
# KSP 2.3.12 verified against Kotlin 2.4.21 + AGP 9.5.0 built-in Kotlin: :app:kspDebugKotlin (Hilt 2.60.1) passes, no pin needed.
ksp = "2.3.12"
hilt = "2.60.1"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
spotless = "8.10.4"
ktlint = "1.8.0"
kover = "0.9.11"
junit-jupiter = "6.1.3"
kotest = "6.2.6"
robolectric = "4.17"
detekt = "2.0.0-alpha.6"
jdk = "17"
compile-sdk = "37"
target-sdk = "36"
min-sdk = "29"

[libraries]
# App
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

# Testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-jupiter" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Gradle plugins used by build-logic (compileOnly; the root build puts them on the classpath)
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Convention plugins (build-logic)
rubikxplorer-jvm-core = { id = "rubikxplorer.jvm-core" }
rubikxplorer-android-app = { id = "rubikxplorer.android-app" }
rubikxplorer-quality = { id = "rubikxplorer.quality" }
rubikxplorer-release = { id = "rubikxplorer.release" }
