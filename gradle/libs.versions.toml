[versions]
kotlin = "2.4.21"
agp = "9.5.0"
# KSP 2.3.12 verified against Kotlin 2.4.21 + AGP 9.5.0 built-in Kotlin: :app:kspDebugKotlin (Hilt 2.60.1) passes, no pin needed.
ksp = "2.3.12"
hilt = "2.60.1"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
spotless = "8.10.4"
ktlint = "1.8.0"
kover = "0.9.11"
junit-jupiter = "6.1.3"
kotest = "6.2.6"
# Verified on Maven Central 2026-10-30; built for Kotlin 2.4 (AD-6 content parser).
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
robolectric = "4.17"
# OQ-3 spike only (Story 1.8): latest stable on Maven Central 2026-10-30; Filament 1.72.1. Used only with -Prubikxplorer.spike3d=true.
sceneview = "4.63.0"
detekt = "2.0.0-alpha.6"
# Story 1.10 benchmarks, latest stables on Google Maven 2026-10-31. Run on demand only, never in `build`.
benchmark-macro = "1.5.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
uiautomator = "2.4.0"
jdk = "17"
compile-sdk = "37"
target-sdk = "36"
min-sdk = "29"
camera = "1.6.2"
# AD-17 WindowSizeClass; same version the Compose BOM already resolves transitively.
window = "1.5.0"

[libraries]
# App
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-window-core = { module = "androidx.window:window-core", version.ref = "window" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
sceneview = { module = "io.github.sceneview:sceneview", version.ref = "sceneview" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-jupiter" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Benchmarks (:macrobenchmark)
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark-macro" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

# Gradle plugins used by build-logic (compileOnly; the root build puts them on the classpath)
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Convention plugins (build-logic)
rubikxplorer-jvm-core = { id = "rubikxplorer.jvm-core" }
rubikxplorer-android-app = { id = "rubikxplorer.android-app" }
rubikxplorer-quality = { id = "rubikxplorer.quality" }
rubikxplorer-release = { id = "rubikxplorer.release" }
rubikxplorer-android-macrobenchmark = { id = "rubikxplorer.android-macrobenchmark" }
